<section class="owners">
  <h2>Owner management</h2>

  <form (ngSubmit)="save()" #f="ngForm" class="owner-form">
    <input name="name" placeholder="Name" [(ngModel)]="form.name" required />
    <input name="email" type="email" placeholder="Email" [(ngModel)]="form.email" />
    <input name="phone" placeholder="Phone" [(ngModel)]="form.phone" />
    <button type="submit" [disabled]="f.invalid">{{ editingId() === null ? 'Add owner' : 'Save changes' }}</button>
    @if (editingId() !== null) {
      <button type="button" (click)="cancel()">Cancel</button>
    }
  </form>

  <table>
    <thead>
      <tr><th>Name</th><th>Email</th><th>Phone</th><th></th></tr>
    </thead>
    <tbody>
      @for (owner of owners(); track owner.id) {
        <tr>
          <td>{{ owner.name }}</td>
          <td>{{ owner.email }}</td>
          <td>{{ owner.phone }}</td>
          <td>
            <button type="button" (click)="edit(owner)">Edit</button>
            <button type="button" (click)="remove(owner)">Delete</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="4">No owners yet.</td></tr>
      }
    </tbody>
  </table>
</section>
